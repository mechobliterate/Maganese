<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Maganese</title>
        <link rel="stylesheet" href="styles/main.css" />
        <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    </head>
    <body>
        <canvas id="three-canvas"></canvas>
        <video id="video" style="display: none" playsinline></video>

        <div id="controls" class="control-panel">
            <div class="panel-header" id="panel-header">
                <div class="panel-title">SETTINGS</div>
                <button class="toggle-btn" id="btn-toggle-ui">−</button>
            </div>

            <div class="panel-content" id="panel-content">
                <div class="tab-container">
                    <button class="tab-btn active" data-tab="tab-object">
                        Object
                    </button>
                    <button class="tab-btn" data-tab="tab-lighting">
                        Lighting
                    </button>
                    <button class="tab-btn" data-tab="tab-system">
                        System
                    </button>
                </div>

                <div id="tab-object" class="tab-content active">
                    <div class="control-group">
                        <button id="btn-toggle-frame" class="btn">
                            Frame: On
                        </button>

                        <label>Mode</label>
                        <select id="select-mode" class="input-select">
                            <option value="CUBE">CUBE (Pop-out)</option>
                            <option value="HOLE" selected>HOLE (Pit)</option>
                        </select>
                    </div>

                    <div id="cube-params" style="display: none">
                        <div class="control-group">
                            <label
                                >Cube XY
                                <span id="val-cube-xy" class="value-label"
                                    >1.0</span
                                ></label
                            >
                            <input
                                type="range"
                                id="range-cube-xy"
                                min="0.1"
                                max="2.0"
                                step="0.05"
                                value="1.0"
                                class="slider"
                            />
                        </div>
                        <div class="control-group">
                            <label
                                >Cube Z
                                <span id="val-cube-z" class="value-label"
                                    >0.5</span
                                ></label
                            >
                            <input
                                type="range"
                                id="range-cube-z"
                                min="0.1"
                                max="5.0"
                                step="0.05"
                                value="0.5"
                                class="slider"
                            />
                        </div>
                    </div>

                    <div id="hole-params">
                        <div class="control-group">
                            <label
                                >Hole Size
                                <span id="val-hole-scale" class="value-label"
                                    >0.5</span
                                ></label
                            >
                            <input
                                type="range"
                                id="range-hole-scale"
                                min="0.1"
                                max="1.0"
                                step="0.01"
                                value="0.5"
                                class="slider"
                            />
                        </div>
                        <div class="control-group">
                            <label
                                >Hole Depth
                                <span id="val-hole-depth" class="value-label"
                                    >3.0</span
                                ></label
                            >
                            <input
                                type="range"
                                id="range-hole-depth"
                                min="0.1"
                                max="10"
                                step="0.1"
                                value="3.0"
                                class="slider"
                            />
                        </div>
                    </div>
                </div>

                <div id="tab-lighting" class="tab-content">
                    <button id="btn-shadow" class="btn">Light: On</button>
                    <div class="control-group">
                        <label
                            >Intensity
                            <span id="val-light-int" class="value-label"
                                >150</span
                            ></label
                        >
                        <input
                            type="range"
                            id="range-light-int"
                            min="0"
                            max="1000"
                            step="10"
                            value="150"
                            class="slider"
                        />
                    </div>
                    <button id="btn-random-light" class="btn">
                        Random Light Position
                    </button>
                </div>

                <div id="tab-system" class="tab-content">
                    <div class="monitor">
                        X: <span id="raw-x">0</span> Y:
                        <span id="raw-y">0</span> Z: <span id="raw-z">0</span>
                    </div>
                    <div class="control-group">
                        <label
                            >Face Sensitivity
                            <span id="val-move" class="value-label"
                                >2.0</span
                            ></label
                        >
                        <input
                            type="range"
                            id="range-move"
                            min="0.1"
                            max="10.0"
                            step="0.1"
                            value="2.0"
                            class="slider"
                        />
                    </div>
                    <div class="control-group">
                        <label
                            >Distance
                            <span id="val-depth" class="value-label"
                                >5.0</span
                            ></label
                        >
                        <input
                            type="range"
                            id="range-depth"
                            min="1.0"
                            max="20.0"
                            step="0.5"
                            value="5.0"
                            class="slider"
                        />
                    </div>
                    <div class="control-group">
                        <label
                            >Z Sensitivity
                            <span id="val-z-sens" class="value-label"
                                >15.0</span
                            ></label
                        >
                        <input
                            type="range"
                            id="range-z-sens"
                            min="0.1"
                            max="50.0"
                            step="0.1"
                            value="15.0"
                            class="slider"
                        />
                    </div>
                    <button id="btn-calibrate" class="btn">
                        Calibrate Center
                    </button>
                    <input
                        type="file"
                        id="input-file"
                        accept="image/*"
                        style="display: none"
                    />
                    <button
                        onclick="document.getElementById('input-file').click()"
                        class="btn"
                    >
                        Change Image
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="scripts/main.js"></script>
    </body>
</html>
